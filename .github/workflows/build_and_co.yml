name: Build, Sign and Release Android App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_android_app:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect version & create tag
        id: versioncheck
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build_sign_and_release_android_app:
    needs: prepare_android_app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android App
        run: ./gradlew :app:assembleRelease

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          # Use the APK signed by Gradle
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          FINAL_APK="All-Miner-v${{ needs.prepare_android_app.outputs.version }}.apk"
          
          cp "$SOURCE_APK" "$FINAL_APK"
          echo "final_apk=$FINAL_APK" >> $GITHUB_OUTPUT

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.final_apk }}
          path: ${{ steps.prepare_apk.outputs.final_apk }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK to Release
        if: needs.prepare_android_app.outputs.create_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare_android_app.outputs.version }}
          files: |
            ${{ steps.prepare_apk.outputs.final_apk }}
          draft: true
          generate_release_notes: true
